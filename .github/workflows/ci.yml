name: Phase 1 checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: gsn, POSTGRES_PASSWORD: test, POSTGRES_DB: gsn_test}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U gsn -d gsn_test" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run: {working-directory: services/api}
    env:
      AUTH_SECRET: ci-test-only-secret-with-more-than-32-characters
      TEST_DATABASE_URL: postgresql+psycopg://gsn:test@localhost:5432/gsn_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.lock
      - run: python -m pytest -q
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: apps/web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - name: Wait for API and run real storage and queue smoke test
        run: |
          for i in $(seq 1 60); do curl -fsS http://localhost:8000/health && break || sleep 3; done
          python scripts/smoke.py
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
